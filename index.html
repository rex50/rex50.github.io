					data-target="#navbar-collapse" aria-expanded="false">
					<span class="sr-only">Toggle navigation</span>
					<span class="icon-bar"></span>
					<span class="icon-bar"></span>
					<span class="icon-bar"></span>
				</button>
				<a class="navbar-brand" href="#home">REX50</a>
			</div>

			<div class="collapse navbar-collapse" id="navbar-collapse">
				<ul class="nav navbar-nav navbar-right">
					<li class="active"><a href="#home"><i class="icon-home4"></i> <span>Home</span></a></li>
					<li><a href="#about"><i class="icon-user2"></i> <span>About</span></a></li>
					<li><a href="#experience"><i class="icon-briefcase2"></i> <span>Experience</span></a></li>
					<li><a href="#skills"><i class="icon-layers"></i> <span>Skills</span></a></li>

	<div id="page-content">

		<!-- Home Section -->
		<section id="home">
			<div class="container">
				<div class="row">
					<div class="col-md-12 hero-text">
						<h1 id="hero-name" data-text=""></h1>
						<h2 id="hero-title"></h2>
						<p id="hero-subtitle" class="animate-box"></p>
						<p><a href="#contact" id="hero-cta" class="btn-retro"></a></p>
					</div>
				</div>
			</div>
		</section>

		<!-- About Section -->
		<section id="about">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="about-title"></h2>
					</div>
				</div>
				<div class="row">
					<div class="col-md-5 animate-box">
						<img id="about-image" class="img-responsive" src="" alt=""
							style="border: 2px solid var(--neon-cyan); box-shadow: 0 0 15px var(--neon-cyan);">
					</div>
					<div class="col-md-7 animate-box">
						<div class="retro-card" id="about-content">
							<!-- Populated by JS -->
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- Experience Section -->
		<section id="experience">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="experience-title"></h2>
					</div>
				</div>
				<div class="row">
					<div class="col-md-12 animate-box" id="experience-list">
						<!-- Populated by JS -->
					</div>
				</div>
			</div>
		</section>

		<!-- Skills Section -->
		<section id="skills">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="skills-title"></h2>
					</div>
				</div>
				<div class="row">
					<div class="col-md-12 animate-box text-center">
						<div class="retro-card">
							<h3>Key Skills</h3>
							<div id="key-skills-list">
								<!-- Populated by JS -->
							</div>
						</div>
					</div>
				</div>
				<div class="row" style="margin-top: 20px;">
					<div class="col-md-6 animate-box">
						<div class="retro-card">
							<h3>Tech Stack</h3>
							<div class="row" id="tech-stack-list"
								style="display: flex; align-items: center; justify-content: center;">
								<!-- Populated by JS -->
							</div>
						</div>
					</div>
					<div class="col-md-6 animate-box">
						<div class="retro-card">
							<h3>Tools</h3>
							<div class="row" id="tools-list"
								style="display: flex; align-items: center; justify-content: center;">
								<!-- Populated by JS -->
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>

		<!-- Work Section -->
		<section id="work">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="projects-title"></h2>
					</div>
				</div>
				<div class="row" id="projects-list">
					<!-- Populated by JS -->
				</div>
				<div class="row">
					<div class="col-md-12 text-center" style="margin-top: 30px;">
						<h4>Other Products</h4>
						<p id="other-products-list">
							<!-- Populated by JS -->
						</p>
					</div>
				</div>
			</div>
		</section>

		<!-- Blog Section -->
		<section id="blog">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="blog-title"></h2>
					</div>
				</div>
				<div class="row animate-box">
					<div class="owl-carousel1" id="blog-list">
						<!-- Populated by JS -->
					</div>
				</div>
			</div>
		</section>

		<!-- Contact Section -->
		<section id="contact">
			<div class="container">
				<div class="row">
					<div class="col-md-12">
						<h2 class="section-title" id="contact-title"></h2>
					</div>
				</div>
				<div class="row">
					<div class="col-md-4 animate-box">
						<div class="retro-card">
							<h3>Coordinates</h3>
							<p><span><i class="icon-map5"></i></span> <span id="contact-location"></span></p>
							<p><span><i class="icon-phone4"></i></span> <span id="contact-phone"></span></p>
							<p><span><i class="icon-envelope2"></i></span> <a href="" id="contact-email"></a></p>
							<p class="colorlib-social-icons" id="contact-social">
								<!-- Populated by JS -->
							</p>
						</div>
					</div>
					<div class="col-md-7 col-md-push-1 animate-box">
						<form action="https://formspree.io/f/xyyogavz" method="POST" class="retro-form">
							<div class="row">
								<div class="col-md-6">
									<div class="form-group">
										<input name="_name" type="text" class="form-control" id="input-name"
											placeholder="Name" required="">
									</div>
								</div>
								<div class="col-md-6">
									<div class="form-group">
										<input name="_replyto" type="email" class="form-control" id="input-email"
											placeholder="Email" required="">
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<textarea name="_message" class="form-control" id="input-msg" cols="30" rows="7"
											placeholder="Message" required=""></textarea>
									</div>
								</div>
								<div class="col-md-12">
									<div class="form-group">
										<input type="submit" value="Send Transmission" class="btn-retro"
											id="btn-submit-contact">
									</div>
								</div>
								<input type="hidden" name="_subject" id="email-subject" value="Contact Form Submission">
							</div>
						</form>
					</div>
				</div>
			</div>
		</section>

		<footer>
			<div class="container">
				<div class="row">
					<div class="col-md-12">
